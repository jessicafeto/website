# Netlify configuration for the noova Next.js site.
# The official Next.js runtime handles SSR, the App Router and next-intl
# middleware automatically — no extra adapter needed.

[build]
  # Plain Next.js build — lighter/cheaper on build minutes. (The Tina /admin
  # editor is not built here; content is edited in the repo directly. To bring
  # the Tina editor back, restore: "tinacms build --skip-cloud-checks && next build".)
  command = "next build"
  publish = ".next"

[build.environment]
  # Next.js 15 requires Node >= 18.18; pin to an LTS for reproducible builds.
  NODE_VERSION = "20"
  # Tina's admin bundle needs headroom during the build.
  NODE_OPTIONS = "--max-old-space-size=4096"

[[plugins]]
  package = "@netlify/plugin-nextjs"
